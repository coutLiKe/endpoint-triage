[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-triage"
dynamic = ["version"]
description = "Cross-platform, read-only endpoint diagnostics for help desk tickets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
endpoint-triage = "endpoint_triage.cli:main"

[tool.setuptools.dynamic]
version = { attr = "endpoint_triage.__version__" }

[tool.setuptools.packages.find]
include = ["endpoint_triage*"]
